name = "siap-apbd-mahulu"
main = "src/index.js"
compatibility_date = "2026-10-19"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "siap-apbd-mahulu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DOCS_R2"
bucket_name = "siap-apbd-mahulu-docs"
