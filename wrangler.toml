name = "siap-apbd-mahulu"
main = "src/index.js"
compatibility_date = "2026-10-19"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "siap-apbd-mahakamulu"
database_id = "4e9be2e3-44e0-442b-b5ed-93aa05c6632d"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DOCS_R2"
bucket_name = "siap-apbd-mahulu-docs"
